site_name: allwrite
site_description: Documentation for the allwrite CLI and recipe library
site_url: https://allegro.github.io/allwrite/
repo_url: https://github.com/allegro/allwrite
repo_name: allegro/allwrite
edit_uri: edit/main/docs/
theme:
  name: material
  language: en
  font:
    text: sans-serif
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    logo: material/auto-fix
plugins:
  - search
  - awesome-pages
nav:
  - Overview: index.md
  - CLI reference: cli.md
  - Writing recipes: contributing.md
  - Recipes:
      - Overview: recipes/index.md
      - YAML:
          - ExpandMappings: recipes/yaml/expand-mappings.md
          - UnnestProperties: recipes/yaml/unnest-properties.md
          - AddTopLevelLineBreaks: recipes/yaml/add-top-level-line-breaks.md
          - DeleteProperty: recipes/yaml/delete-property.md
          - FindKey: recipes/yaml/find-key.md
          - YamlEntryHasValue: recipes/yaml/yaml-entry-has-value.md
      - Gradle:
          - AddGradleDependency: recipes/gradle/add-gradle-dependency.md
          - ChangeGradleDependency: recipes/gradle/change-gradle-dependency.md
          - UpdateGradleDependency: recipes/gradle/update-gradle-dependency.md
      - Java / Kotlin:
          - ChangeType: recipes/java/change-type.md
          - ChangeRecordField: recipes/java/change-record-field.md
          - SimplifyMethodChain: recipes/java/simplify-method-chain.md
          - RemoveUnusedPrivateFields: recipes/java/remove-unused-private-fields.md
          - RemoveUnusedImportsOfType: recipes/java/remove-unused-imports-of-type.md
          - ReplaceFactoryWithConstructor: recipes/java/replace-factory-with-constructor.md
      - Spring:
          - FindSpringProperty: recipes/spring/find-spring-property.md
          - DeleteSpringProperty: recipes/spring/delete-spring-property.md
          - DeleteSpringPropertyWithValue: recipes/spring/delete-spring-property-with-value.md
          - DeleteSpringPropertyFromSpringAnnotations: recipes/spring/delete-spring-property-from-spring-annotations.md
          - ChangeSpringPropertyKey: recipes/spring/change-spring-property-key.md
          - RemoveAnnotatedMethod: recipes/spring/remove-annotated-method.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
extra_css:
  - extra.css
extra:
  version:
    provider: mike
